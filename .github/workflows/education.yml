name: Education build and demo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  education:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      PYTHONPATH: education/service/src
      QINGQI_PYTHON: python
      QINGQI_NODE: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install -r education/service/requirements.txt
      - run: python education/tools/directory_docs.py --check
      - run: pnpm education:build
      - run: python education/tests/demo_acceptance.py
